# Overlay for running the app on a shared server, behind a proxy that terminates TLS.
#
#   DB_PASSWORD=... WEB_BIND=10.0.0.5 WEB_PORT=8490 \
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# What changes from the local stack:
#   - Only the web container is reachable from outside, and only on WEB_BIND:WEB_PORT.
#     The API and the database publish no ports, and the database sits on a network with
#     no route out.
#   - DB_PASSWORD has no default.
#   - Every container runs without root privileges, on a read-only filesystem, with memory,
#     CPU and process limits and bounded logs, and comes back after a reboot.
#
# The proxy in front should refuse POST /api/reload, which is open by design for local use.

x-locked-down: &locked-down
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '3' }

services:
  db:
    <<: *locked-down
    # As the image's own postgres user from the start, so it needs no privileges to drop.
    user: postgres
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    ports: !reset []
    networks: [data]
    tmpfs: [/tmp, /var/run/postgresql]
    shm_size: 256m
    mem_limit: 1g
    cpus: 2
    pids_limit: 200

  backend:
    <<: *locked-down
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      # The JVM sizes its heap from the container's memory limit, not the host's.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
    ports: !reset []
    networks: [edge, data]
    tmpfs: [/tmp]
    mem_limit: 1g
    cpus: 2
    pids_limit: 300

  web:
    <<: *locked-down
    ports: !override
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:80'
    networks: [edge]
    # nginx starts as root to bind port 80 and hand its workers to the nginx user.
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    mem_limit: 128m
    cpus: 1
    pids_limit: 100

networks:
  edge: {}
  data:
    internal: true
